name: Wheelhouse Daily Scan

# Runs automatically every weekday morning before market open (13:00 UTC ~ 8am ET,
# adjust the cron below if you're in a different timezone or want a different time),
# AND can be triggered manually anytime from the "Actions" tab in GitHub.
on:
  schedule:
    - cron: "7 12 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan and generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python report.py

      - name: Resolve outcomes for expired ideas
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python resolve_outcomes.py

      - name: Generate history page
        run: python history.py

      - name: Send Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🎡 Today'\''s Wheelhouse scan is ready: https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Commit and push updated report
        run: |
          git config user.name "wheelhouse-bot"
          git config user.email "actions@github.com"
          git add docs/index.html docs/history.html wheelhouse.db
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
