name: Wheelhouse Daily Scan

# Runs automatically every weekday morning before market open. Three
# staggered trigger times (7:07 / 7:37 / 8:07 AM Central) act as backups for
# each other -- GitHub Actions has had real reliability problems recently
# (delayed or dropped scheduled runs), so if the first trigger doesn't fire
# or fails, a later one picks up the slack. Whichever one fires FIRST on a
# given day becomes the official "scheduled" record (see report.py); any
# redundant later trigger does nothing at all (no data pull, no dashboard
# change, no duplicate email) so history and the dashboard can never diverge
# on the same day. Can also be triggered manually anytime from the "Actions" tab.
on:
  schedule:
    - cron: "7 12 * * 1-5"
    - cron: "37 12 * * 1-5"
    - cron: "7 13 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan and generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python report.py

      - name: Resolve outcomes for expired ideas
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python resolve_outcomes.py

      - name: Generate history page
        run: python history.py

      - name: Generate performance page
        run: python performance.py

      - name: Check for email summary
        id: check_email
        run: echo "exists=$( [ -f email_summary.html ] && echo true || echo false )" >> "$GITHUB_OUTPUT"

      - name: Send email with scan results (optional)
        if: steps.check_email.outputs.exists == 'true' && env.EMAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🎡 Wheelhouse Daily Scan Results"
          to: ${{ secrets.EMAIL_TO }}
          from: Wheelhouse Bot
          html_body: file://email_summary.html

      - name: Send Slack notification (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🎡 Today'\''s Wheelhouse scan is ready: https://YOUR_GITHUB_USERNAME.github.io/YOUR_REPO_NAME/"}' \
            "$SLACK_WEBHOOK_URL"

      - name: Commit and push updated report
        run: |
          git config user.name "wheelhouse-bot"
          git config user.email "actions@github.com"
          git add docs/index.html docs/history.html docs/performance.html wheelhouse.db
          git diff --quiet && git diff --staged --quiet || git commit -m "Daily scan: $(date -u +'%Y-%m-%d')"
          git pull --rebase origin main
          git push
